name: 48M dual hypertensor and decoder parity
on:
  push:
    branches: [main]
    paths:
      - 'include/nanlm/dual_tensor_arena.hpp'
      - 'include/nanlm/native48m_feedback.hpp'
      - 'include/nanlm/native_mirror_triangle_leaf_feedback.hpp'
      - 'include/nanlm/tensor_leaf_sidecar.hpp'
      - 'tests/test_native_mirror_triangle_field.cpp'
      - 'tests/test_native48m_feedback.cpp'
      - 'include/nanlm/native48m_feedback_json.hpp'
      - 'tools/nanlm48m_native_emit.cpp'
      - 'mth/nan16/mth_meta_trihead.nas'
      - 'mth/nan16/mth_phase_encode.nas'
      - 'mth/drivers/field_driver.nas'
      - 'tools/verify_native_memory_map.py'
      - 'tools/check_unified_48m_manifest.py'
      - 'spec/unified_48m_math_manifest.v1.json'
      - 'spec/branch_reconciliation/**'
      - 'src/raw_field.cpp'
      - 'Makefile'
      - 'tools/decoder48m_candidate.py'
      - 'tests/test_dual_tensor_arena.cpp'
      - 'tests/test_decoder48m_candidate.py'
      - 'tests/test_meta_attention_source.py'
      - 'mth/nan16/mth_meta_attention16_f32.nas'
      - 'mth/nan16/**'
      - 'mth/drivers/**'
      - 'mth/tests/**'
      - '.github/workflows/48m-head-triad-tensor-meta.yml'
  pull_request:
    paths:
      - 'include/nanlm/dual_tensor_arena.hpp'
      - 'include/nanlm/native48m_feedback.hpp'
      - 'include/nanlm/native_mirror_triangle_leaf_feedback.hpp'
      - 'include/nanlm/tensor_leaf_sidecar.hpp'
      - 'tests/test_native_mirror_triangle_field.cpp'
      - 'tests/test_native48m_feedback.cpp'
      - 'include/nanlm/native48m_feedback_json.hpp'
      - 'tools/nanlm48m_native_emit.cpp'
      - 'mth/nan16/mth_meta_trihead.nas'
      - 'mth/nan16/mth_phase_encode.nas'
      - 'mth/drivers/field_driver.nas'
      - 'tools/verify_native_memory_map.py'
      - 'tools/check_unified_48m_manifest.py'
      - 'spec/unified_48m_math_manifest.v1.json'
      - 'spec/branch_reconciliation/**'
      - 'src/raw_field.cpp'
      - 'Makefile'
      - 'tools/decoder48m_candidate.py'
      - 'tests/test_dual_tensor_arena.cpp'
      - 'tests/test_decoder48m_candidate.py'
      - 'tests/test_meta_attention_source.py'
      - 'mth/nan16/mth_meta_attention16_f32.nas'
      - 'mth/nan16/**'
      - 'mth/drivers/**'
      - 'mth/tests/**'
      - '.github/workflows/48m-head-triad-tensor-meta.yml'
jobs:
  frozen-decoder-and-tensor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all seven credit channels and full 33-branch inventory
        run: python3 tools/check_unified_48m_manifest.py
      - name: Test full mirrored 128MiB active/candidate tensor and gates
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -pedantic -Iinclude tests/test_dual_tensor_arena.cpp -o /tmp/test_dual_tensor_arena
          /tmp/test_dual_tensor_arena
      - name: Test real NaN16 phase-trihead-Hodge-MC0 dual tensor feedback
        run: |
          make -j2 build/test_native48m_feedback
          python3 tools/verify_native_memory_map.py build/field_driver.nan
          ./build/test_native48m_feedback
      - name: Verify real NaN16 palindrome/mirror curl -> Poincare -> typed tensor candidate
        run: |
          make -j2 build/test_native_mirror_triangle_field
          ./build/test_native_mirror_triangle_field
      - name: Emit original-decoder candidate from real native corpus windows
        run: |
          make -j2 build/nanlm48m-native-emit
          printf 'the bright river reflects the light and gentle sky' > /tmp/native48m-past.txt
          printf 'a quiet bird moves above the river as clouds drift' > /tmp/native48m-current.txt
          ./build/nanlm48m-native-emit /tmp/native48m-past.txt /tmp/native48m-current.txt 'the bright river' bird /tmp/native48m-candidate.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          request=json.loads(Path('/tmp/native48m-candidate.json').read_text())
          assert request['schema']=='nanlm.48m-native-feedback/1'
          assert request['query_words']==['bird']
          assert request['native_evidence']['committed_history_slots']==1
          assert request['native_evidence']['candidate_staged'] is True
          assert request['native_evidence']['automatic_promotion'] is False
          print('native48m_candidate_receipt='+json.dumps(request,sort_keys=True))
          PY
      - name: Test exact frozen 48M candidate math and MC0 masking contract
        run: |
          python3 -m unittest discover -s tests -p test_decoder48m_candidate.py -v
          python3 -m unittest discover -s tests -p test_meta_attention_source.py -v
