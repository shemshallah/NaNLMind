name: NaN16 VM scan proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'formal/utm/MinskyNaN16VM.v'
      - 'formal/utm/MinskyNaN16ScanLoop.v'
      - 'formal/utm/MinskyNaN16Action.v'
      - 'formal/utm/MinskyNaN16ActionPrefix.v'
      - 'formal/utm/MinskyNaN16ActionMove.v'
      - 'formal/utm/MinskyNaN16ActionSuffix.v'
      - 'formal/utm/MinskyNaN16ActionRefines.v'
      - 'formal/utm/MinskyNaN16ActionRun.v'
      - 'formal/utm/MinskyNaN16SourceArith.v'
      - 'formal/utm/MinskyNaN16Window.v'
      - 'formal/utm/MinskyNaN16ScanFrame.v'
      - 'formal/utm/MinskyNaN16ScanPhase.v'
      - 'formal/utm/MinskyNaN16Lookup.v'
      - 'formal/utm/MinskyNaN16StepHit.v'
      - 'formal/utm/MinskyNaN16StepNone.v'
      - 'formal/utm/MinskyNaN16Step.v'
      - 'formal/utm/MinskyNaN16StepSpec.v'
      - 'formal/utm/MinskyNaN16StepEntrySpec.v'
      - 'formal/utm/MinskyNaN16Run.v'
      - 'formal/utm/MinskyNaN16Prelude.v'
      - 'formal/utm/MinskyNaN16PreludeReady.v'
      - '.github/workflows/minsky-nan16-vm.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  nan16-vm:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Locate pinned Coq 8.20 toolchain
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version

      - name: Compile the NaN16 VM chain
        run: |
          set -euo pipefail
          MODULES="
            MinskyTableData
            MinskyTable
            MinskyAddressRefinement
            MinskyNaN16Window
            MinskyChartEncoding
            MinskyChartScan
            MinskyNativeBounds
            MinskyNativePages
            MinskyNaN16Words
            MinskyNaN16VM
            MinskyNaN16Action
            MinskyNaN16ActionMove
            MinskyNaN16ActionSuffix
            MinskyNaN16ActionPrefix
            MinskyNaN16ActionRefines
            MinskyNaN16ActionRun
            MinskyNaN16ScanLoop
            MinskyNaN16ScanFrame
            MinskyNaN16ScanPhase
            MinskyNaN16Lookup
            MinskyNaN16SourceArith
            MinskyNaN16StepHit
            MinskyNaN16StepNone
            MinskyNaN16Step
            MinskyNaN16StepSpec
            MinskyNaN16Prelude
            MinskyNaN16PreludeReady
            MinskyNaN16StepEntrySpec
            MinskyNaN16Run
          "
          for f in $MODULES; do
            echo "=== coqc $f"
            coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              "formal/utm/$f.v"
          done
          echo "NAN16 VM CHAIN COMPILED"

      - name: Kernel-check the NaN16 VM chain
        run: |
          set -euo pipefail
          MODULES="
            MinskyTableData
            MinskyTable
            MinskyAddressRefinement
            MinskyNaN16Window
            MinskyChartEncoding
            MinskyChartScan
            MinskyNativeBounds
            MinskyNativePages
            MinskyNaN16Words
            MinskyNaN16VM
            MinskyNaN16Action
            MinskyNaN16ActionPrefix
            MinskyNaN16ActionRefines
            MinskyNaN16ActionRun
            MinskyNaN16ScanLoop
            MinskyNaN16ScanFrame
            MinskyNaN16ScanPhase
            MinskyNaN16Lookup
            MinskyNaN16SourceArith
            MinskyNaN16StepHit
            MinskyNaN16StepNone
            MinskyNaN16Step
            MinskyNaN16StepSpec
            MinskyNaN16Prelude
            MinskyNaN16PreludeReady
          "
          for f in $MODULES; do
            echo "=== coqchk $f"
            coqchk -Q formal/utm NaNLM "formal/utm/$f.vo"
          done
          echo "NAN16 VM CHAIN KERNEL-CHECKED"

      - name: Upload NaN16 VM certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nan16-vm-${{ github.run_id }}
          path: |
            formal/utm/MinskyTableData.v
            formal/utm/MinskyTableData.vo
            formal/utm/MinskyTable.v
            formal/utm/MinskyTable.vo
            formal/utm/MinskyAddressRefinement.v
            formal/utm/MinskyAddressRefinement.vo
            formal/utm/MinskyNaN16Window.v
            formal/utm/MinskyNaN16Window.vo
            formal/utm/MinskyChartEncoding.v
            formal/utm/MinskyChartEncoding.vo
            formal/utm/MinskyChartScan.v
            formal/utm/MinskyChartScan.vo
            formal/utm/MinskyNativeBounds.v
            formal/utm/MinskyNativeBounds.vo
            formal/utm/MinskyNativePages.v
            formal/utm/MinskyNativePages.vo
            formal/utm/MinskyNaN16Words.v
            formal/utm/MinskyNaN16Words.vo
            formal/utm/MinskyNaN16VM.v
            formal/utm/MinskyNaN16VM.vo
            formal/utm/MinskyNaN16Action.v
            formal/utm/MinskyNaN16Action.vo
            formal/utm/MinskyNaN16ActionMove.v
            formal/utm/MinskyNaN16ActionMove.vo
            formal/utm/MinskyNaN16ActionSuffix.v
            formal/utm/MinskyNaN16ActionSuffix.vo
            formal/utm/MinskyNaN16ActionPrefix.v
            formal/utm/MinskyNaN16ActionPrefix.vo
            formal/utm/MinskyNaN16ActionRefines.v
            formal/utm/MinskyNaN16ActionRefines.vo
            formal/utm/MinskyNaN16ActionRun.v
            formal/utm/MinskyNaN16ActionRun.vo
            formal/utm/MinskyNaN16ScanLoop.v
            formal/utm/MinskyNaN16ScanLoop.vo
            formal/utm/MinskyNaN16ScanFrame.v
            formal/utm/MinskyNaN16ScanFrame.vo
            formal/utm/MinskyNaN16ScanPhase.v
            formal/utm/MinskyNaN16ScanPhase.vo
            formal/utm/MinskyNaN16Lookup.v
            formal/utm/MinskyNaN16Lookup.vo
            formal/utm/MinskyNaN16SourceArith.v
            formal/utm/MinskyNaN16SourceArith.vo
            formal/utm/MinskyNaN16StepHit.v
            formal/utm/MinskyNaN16StepHit.vo
            formal/utm/MinskyNaN16StepNone.v
            formal/utm/MinskyNaN16StepNone.vo
            formal/utm/MinskyNaN16Step.v
            formal/utm/MinskyNaN16Step.vo
            formal/utm/MinskyNaN16StepSpec.v
            formal/utm/MinskyNaN16StepSpec.vo
            formal/utm/MinskyNaN16Prelude.v
            formal/utm/MinskyNaN16Prelude.vo
            formal/utm/MinskyNaN16PreludeReady.v
            formal/utm/MinskyNaN16PreludeReady.vo
            formal/utm/MinskyNaN16StepEntrySpec.v
            formal/utm/MinskyNaN16StepEntrySpec.vo
            formal/utm/MinskyNaN16Run.v
            formal/utm/MinskyNaN16Run.vo
          if-no-files-found: warn
