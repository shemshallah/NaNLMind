name: NaN16 VM scan proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'formal/utm/MinskyNaN16VM.v'
      - 'formal/utm/MinskyNaN16ScanLoop.v'
      - '.github/workflows/minsky-nan16-vm.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  nan16-vm:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Locate pinned Coq 8.20 toolchain
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version

      - name: Compile the NaN16 VM chain
        run: |
          set -euo pipefail
          MODULES="
            MinskyTableData
            MinskyTable
            MinskyAddressRefinement
            MinskyChartEncoding
            MinskyChartScan
            MinskyNativeBounds
            MinskyNativePages
            MinskyNaN16Words
            MinskyNaN16VM
            MinskyNaN16ScanLoop
          "
          for f in $MODULES; do
            echo "=== coqc $f"
            coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              "formal/utm/$f.v"
          done
          echo "NAN16 VM CHAIN COMPILED"

      - name: Kernel-check the NaN16 VM chain
        run: |
          set -euo pipefail
          MODULES="
            MinskyTableData
            MinskyTable
            MinskyAddressRefinement
            MinskyChartEncoding
            MinskyChartScan
            MinskyNativeBounds
            MinskyNativePages
            MinskyNaN16Words
            MinskyNaN16VM
            MinskyNaN16ScanLoop
          "
          for f in $MODULES; do
            echo "=== coqchk $f"
            coqchk -Q formal/utm NaNLM "formal/utm/$f.vo"
          done
          echo "NAN16 VM CHAIN KERNEL-CHECKED"

      - name: Upload NaN16 VM certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nan16-vm-${{ github.run_id }}
          path: |
            formal/utm/MinskyTableData.v
            formal/utm/MinskyTableData.vo
            formal/utm/MinskyTable.v
            formal/utm/MinskyTable.vo
            formal/utm/MinskyAddressRefinement.v
            formal/utm/MinskyAddressRefinement.vo
            formal/utm/MinskyChartEncoding.v
            formal/utm/MinskyChartEncoding.vo
            formal/utm/MinskyChartScan.v
            formal/utm/MinskyChartScan.vo
            formal/utm/MinskyNativeBounds.v
            formal/utm/MinskyNativeBounds.vo
            formal/utm/MinskyNativePages.v
            formal/utm/MinskyNativePages.vo
            formal/utm/MinskyNaN16Words.v
            formal/utm/MinskyNaN16Words.vo
            formal/utm/MinskyNaN16VM.v
            formal/utm/MinskyNaN16VM.vo
            formal/utm/MinskyNaN16ScanLoop.v
            formal/utm/MinskyNaN16ScanLoop.vo
          if-no-files-found: warn
