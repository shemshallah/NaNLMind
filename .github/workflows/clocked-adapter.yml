name: Clocked adapter tests

on:
  pull_request:
    paths:
      - "integrations/clocked/**"
      - ".github/workflows/clocked-adapter.yml"
      - "include/nanlm/endpoint_evidence.hpp"
      - "src/endpoint_evidence.cpp"
      - "tests/test_endpoint_evidence.cpp"
      - "include/nanlm/learning_mesh.hpp"
      - "src/learning_mesh.cpp"
      - "tests/test_learning_mesh.cpp"
      - "Makefile"
      - "docs/72_CANONICAL_TRAINING_UNIVERSE.md"
  push:
    branches: [main, clocked-universe]
    paths:
      - "integrations/clocked/**"
      - ".github/workflows/clocked-adapter.yml"
      - "include/nanlm/endpoint_evidence.hpp"
      - "src/endpoint_evidence.cpp"
      - "tests/test_endpoint_evidence.cpp"
      - "include/nanlm/learning_mesh.hpp"
      - "src/learning_mesh.cpp"
      - "tests/test_learning_mesh.cpp"
      - "Makefile"
      - "docs/72_CANONICAL_TRAINING_UNIVERSE.md"

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline adapter and gateway tests
        run: python -m unittest discover -s integrations/clocked -p "test_*.py" -v
      - name: Build native Overbootstrap tests through the project Makefile
        run: |
          make -j2 build/test_endpoint_evidence build/test_learning_mesh build/clocked-demo
          ./build/test_endpoint_evidence
          ./build/test_learning_mesh
      - name: Run offline Clocked-to-native learning demo
        run: make clocked-demo-test
