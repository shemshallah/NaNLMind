name: Generalized p-bit Minsky fixture trace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/wide-fixture.yml'
      - 'formal/utm/MinskyWideFixture.v'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  trace:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate Coq 8.20
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version
      - name: Cross-check native image
        run: python3 formal/utm/check_minsky_wide_fixture.py
      - name: Kernel-check generalized compiler trace
        run: |
          set -euo pipefail
          coqc -Q formal/utm NaNLM -w -notation-overridden,-stdlib-vector formal/utm/MinskyTableData.v
          coqc -Q formal/utm NaNLM -w -notation-overridden,-stdlib-vector formal/utm/MinskyTable.v
          coqc -Q formal/utm NaNLM -w -notation-overridden,-stdlib-vector formal/utm/MinskyWideFixture.v
          coqc -Q formal/utm NaNLM -w -notation-overridden,-stdlib-vector formal/utm/MinskyP16Fixture.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyWideFixture.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyP16Fixture.vo
          echo "NANLM GENERALIZED P-BIT MINSKY FIXTURE TRACE PASS"
