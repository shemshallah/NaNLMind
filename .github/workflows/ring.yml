name: nanlm ring
# One logical epoch of the 6-slot head ring. Each slot is dispatched and awaited
# in interleaved order; the next epoch is handed off by a fresh workflow run.
on:
  workflow_dispatch:
    inputs:
      epoch:
        description: logical epoch
        type: string
        default: "0"
      minutes:
        description: loop wall-clock budget (max 300)
        type: string
        default: "300"
      epochs:
        description: epochs per persistent loop job
        type: string
        default: "200"
      loop:
        description: dispatch the next epoch when this one completes
        type: boolean
        default: true

permissions:
  actions: write
  contents: read

concurrency:
  group: nanlm-canonical-training-fold
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_PAT: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_MAIN: ${{ github.repository }}
  DEEPREPO_RAM: ${{ vars.NANLM_RAM || format('{0}/nanlm-ram', github.repository_owner) }}
  DEEPREPO_VRAM: ${{ vars.NANLM_VRAM || format('{0}/nanlm-vram', github.repository_owner) }}
  DEEPREPO_RAM_BACKEND: github
  DEEPREPO_VRAM_BACKEND: github
  NANLM_CORE: .
  PYTHONPATH: engine:.

jobs:
  ring:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Checkout deeprepo engine
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/deeprepo', github.repository_owner) }}
          token: ${{ secrets.DEEPREPO_PAT || github.token }}
          path: engine

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-core.txt

      - run: pip install -r engine/requirements-core.txt

      - name: Preflight
        run: |
          [ -n "$DEEPREPO_PAT" ] || { echo "::error::Missing DEEPREPO_PAT"; exit 1; }
          make -j2
          ./build/nanlm-universal verify
          ./build/nanlm-universal heads
          ./build/nanlm-universal phase

      - name: Rate-limit gate
        run: |
          python - <<'PY'
          import json, os, urllib.request
          req = urllib.request.Request("https://api.github.com/rate_limit",
              headers={"Authorization": f"Bearer {os.environ['DEEPREPO_PAT']}",
                       "User-Agent": "nanlmind"})
          core = json.load(urllib.request.urlopen(req, timeout=20))["resources"]["core"]
          print("core remaining", core["remaining"], "of", core["limit"])
          if core["remaining"] < 200:
              raise SystemExit("GitHub API core budget too low")
          PY

      - name: Wall anchor
        run: |
          PYTHONPATH=engine:. python3 runner/atomic_clock.py --sync

      - name: Gate selftest
        run: |
          PYTHONPATH=engine:. python3 runner/nanlm_worker.py --op selftest --slot 1 --epoch "${{ inputs.epoch }}"

      - name: Dispatch 6-slot head epoch
        id: dispatch
        run: |
          python runner/ring_dispatch.py \
            --owner "${{ github.repository_owner }}" \
            --epoch "${{ inputs.epoch }}" \
            --minutes "${{ inputs.minutes }}" \
            --epochs "${{ inputs.epochs }}" \
            --persistent \
            --slots 6 | tee ring.json
          next=$(python -c "import json; print(json.load(open('ring.json')).get('next_epoch', ${{ inputs.epoch }} + ${{ inputs.epochs }}))")
          echo "next=$next" >> "$GITHUB_OUTPUT"

      - name: Fold validated NANNET corpus into bootstrap head bank
        if: success() && vars.NANNET_URL != ''
        env:
          NANNET_URL: ${{ vars.NANNET_URL }}
          NANLM_RUNNER_TOKEN: ${{ secrets.NANLM_RUNNER_TOKEN }}
          NANLM_BOOTSTRAP_TOKEN: ${{ secrets.NANLM_BOOTSTRAP_TOKEN }}
        run: |
          if [ -n "$NANLM_RUNNER_TOKEN" ] && [ -n "$NANLM_BOOTSTRAP_TOKEN" ]; then
            pip install --disable-pip-version-check numpy
            python3 runner/nannet_consumer.py
          else
            echo "NANNET credentials are not configured; validated datasets remain queued."
          fi

      - name: Continue to next epoch
        if: ${{ inputs.loop && success() }}
        run: |
          next="${{ steps.dispatch.outputs.next }}"
          gh variable set NANLM_EPOCH --body "$next" -R "${{ github.repository }}" || true
          gh workflow run ring.yml -R "${{ github.repository }}" \
            -f epoch="$next" -f minutes="${{ inputs.minutes }}" \
            -f epochs="${{ inputs.epochs }}" -f loop=true
          echo "next epoch $next dispatched"
