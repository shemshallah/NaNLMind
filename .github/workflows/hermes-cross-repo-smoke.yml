name: Three-repo HERMES signed NANNET lease handshake

on:
  pull_request:
    paths:
      - "runner/training_merge.py"
      - "runner/hermes_router_delegate.py"
      - "nanlmind_nannet/auth.py"
      - "integration/hermes_cross_repo_smoke.py"
      - ".github/workflows/hermes-cross-repo-smoke.yml"
  push:
    paths:
      - "runner/training_merge.py"
      - "runner/hermes_router_delegate.py"
      - "nanlmind_nannet/auth.py"
      - "integration/hermes_cross_repo_smoke.py"
      - ".github/workflows/hermes-cross-repo-smoke.yml"

permissions:
  contents: read

jobs:
  signed-three-repo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout NANNET portal
        uses: actions/checkout@v4
      - name: Checkout NaNROUTER integration branch
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          ref: feat/hermes-n16t-tenant-session-recovery
          path: nanrouter
      - name: Checkout NaNLMind HERMES integration branch
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNLMind_HERMES
          ref: feat/hermes-n16t-dispatch-recovery-plugin
          path: nanhermes
      - name: Checkout source-pinned NaN0S real guest core
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: 7f250a11bdb7845eae06ffb50df202187543ea5e
          path: nan0s
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HERMES signature crypto
        run: python -m pip install "cryptography>=42,<47"
      - name: Compile real NaN0S C VM and both NaN16 guest images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cc -std=gnu99 -O2 -Wall -Wno-misleading-indentation \
            -ffp-contract=off -fno-fast-math -fPIC -shared \
            -DNAN_WORDS=0x100000 \
            nan0s/aarch64/android/core/nan16.c \
            nan0s/aarch64/android/core/nan_dev.c \
            nan0s/aarch64/android/core/nan_load.c \
            nan0s/aarch64/android/core/nan_render.c \
            nan0s/aarch64/android/core/nan_state.c \
            nan0s/aarch64/android/core/nan_net_driver.c \
            -o build/libnan16.so -lm
          awk -f nan0s/tools/nmk.awk -v CMD=emit -v LABELS=build/hermes.labels \
            nanrouter/mth/nan16/hermes_native_runtime.nas > build/hermes.nan
          awk -f nan0s/tools/nmk.awk -v CMD=emit -v LABELS=build/n16t.labels \
            nan0s/src/nannet/n16t_android_guest.nas > build/n16t.nan
          echo "NAN16_LIBRARY=$PWD/build/libnan16.so" >> "$GITHUB_ENV"
          echo "HERMES_GUEST_IMAGE=$PWD/build/hermes.nan" >> "$GITHUB_ENV"
          echo "HERMES_GUEST_LABELS=$PWD/build/hermes.labels" >> "$GITHUB_ENV"
          echo "N16T_GUEST_IMAGE=$PWD/build/n16t.nan" >> "$GITHUB_ENV"
          echo "N16T_GUEST_LABELS=$PWD/build/n16t.labels" >> "$GITHUB_ENV"
          echo "RIDDLE_HERMES_NATIVE_LIBRARY_SHA256=$(sha256sum build/libnan16.so | cut -d' ' -f1)" >> "$GITHUB_ENV"
          echo "RIDDLE_HERMES_NATIVE_IMAGE_SHA256=$(sha256sum build/hermes.nan | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: End-to-end signed HERMES lease handshake with disposable servers
        env:
          PYTHONPATH: ".:nanrouter:nanhermes"
        run: python -m unittest discover -s integration -p "hermes_cross_repo_smoke.py" -v
