name: Fast Coq q15-q22 cycle iteration

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minsky-coq-direction-fast.yml'
      - 'formal/utm/MinskyDirectionRelocationCycle.v'
      - 'formal/utm/check_minsky_left_tagged_dispatch.py'
      - 'formal/utm/check_minsky_four_prefix_direction.py'
      - 'formal/utm/MinskyCanonicalMatch.v'
      - 'formal/utm/MinskyCanonicalCopy.v'
      - 'formal/utm/MinskyCanonicalCopyGeneral.v'
      - 'formal/utm/MinskyCanonicalDirection.v'
      - 'formal/utm/MinskyCanonicalRestore.v'
      - 'formal/utm/MinskyCanonicalDecision.v'
      - 'formal/utm/MinskyCanonicalFetch.v'
      - 'formal/utm/MinskyCanonicalInstruction.v'
      - 'formal/utm/MinskyTaggedHalt.v'
      - 'formal/utm/MinskyTaggedWideDispatch.v'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  cycle:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Locate pinned Coq 8.20
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version

      # This cache is a GitHub Actions artifact produced by the full bridge
      # workflow. All imported .vo dependencies were compiled from the
      # unchanged table and checked source. This job is a fast diagnostic;
      # the full rebuild and coqchk remain the acceptance requirement.
      - name: Restore compiled dependencies from full bridge
        uses: actions/download-artifact@v4
        with:
          name: minsky-coq-bridge-43791910776
          run-id: 43791910776
          github-token: ${{ github.token }}
          path: .

      - name: Compile and kernel-check q15-q22 composition
        run: |
          set -euo pipefail
          # upload-artifact strips the common formal/utm/ directory prefix.
          # Restore object files only; leave checked-out .v sources untouched.
          test -s MinskyTable.vo
          cp ./*.vo formal/utm/
          test -s formal/utm/MinskyTable.vo
          test -s formal/utm/MinskyHeadMoveMacro.vo
          test -s formal/utm/MinskyDirectionDecision.vo
          test -s formal/utm/MinskyRelocationMacro.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyDirectionRelocationCycle.v \
              > /tmp/direction-fast-coq.log 2>&1; then
            tail -n 80 /tmp/direction-fast-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq q15-q22::$line"
            done < <(tail -n 80 /tmp/direction-fast-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyDirectionRelocationCycle.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyTaggedHalt.v \
              > /tmp/tagged-halt-coq.log 2>&1; then
            tail -n 100 /tmp/tagged-halt-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq tagged halt::$line"
            done < <(tail -n 100 /tmp/tagged-halt-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedHalt.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyTaggedWideDispatch.v \
              > /tmp/tagged-wide-dispatch-coq.log 2>&1; then
            tail -n 100 /tmp/tagged-wide-dispatch-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq tagged wide dispatch::$line"
            done < <(tail -n 100 /tmp/tagged-wide-dispatch-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedWideDispatch.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyTaggedRightWide.v \
              > /tmp/minsky-tagged-right-coq.log 2>&1; then
            tail -n 100 /tmp/minsky-tagged-right-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq tagged right wide::$line"
            done < <(tail -n 100 /tmp/minsky-tagged-right-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedRightWide.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyTaggedContinuation.v \
              > /tmp/tagged-continuation-coq.log 2>&1; then
            tail -n 100 /tmp/tagged-continuation-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq tagged continuation::$line"
            done < <(tail -n 100 /tmp/tagged-continuation-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedContinuation.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyTaggedReentry.v \
              > /tmp/tagged-reentry-coq.log 2>&1; then
            tail -n 100 /tmp/tagged-reentry-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq tagged reentry::$line"
            done < <(tail -n 100 /tmp/tagged-reentry-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedReentry.vo
          echo 'NANLM FAST Q15-Q22 COQCHK PASS'

      - name: Independently replay left tagged macro and wrong-guard controls
        run: |
          set -euo pipefail
          python3 formal/utm/check_minsky_table.py
          python3 formal/utm/check_minsky_left_tagged_dispatch.py
          python3 formal/utm/check_minsky_four_prefix_direction.py

  canonical-match:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - name: Locate pinned Coq 8.20
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version

      - name: Restore compiled dependencies from full bridge
        uses: actions/download-artifact@v4
        with:
          name: minsky-coq-bridge-43791910776
          run-id: 43791910776
          github-token: ${{ github.token }}
          path: .

      - name: Compile and kernel-check canonical q5 match
        run: |
          set -euo pipefail
          test -s MinskyTable.vo
          test -s MinskyConcreteEntry.vo
          test -s MinskyMatchMacro.vo
          test -s MinskyConcreteDispatch.vo
          cp ./*.vo formal/utm/
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalMatch.v \
              > /tmp/canonical-match-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-match-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical match::$line"
            done < <(tail -n 100 /tmp/canonical-match-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalMatch.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalCopy.v \
              > /tmp/canonical-copy-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-copy-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical copy::$line"
            done < <(tail -n 100 /tmp/canonical-copy-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalCopy.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalCopyGeneral.v \
              > /tmp/canonical-copy-general-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-copy-general-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical copy general::$line"
            done < <(tail -n 100 /tmp/canonical-copy-general-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalCopyGeneral.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalDirection.v \
              > /tmp/canonical-direction-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-direction-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical direction::$line"
            done < <(tail -n 100 /tmp/canonical-direction-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalDirection.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalRestore.v \
              > /tmp/canonical-restore-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-restore-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical restore::$line"
            done < <(tail -n 100 /tmp/canonical-restore-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalRestore.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalDecision.v \
              > /tmp/canonical-decision-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-decision-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical decision::$line"
            done < <(tail -n 100 /tmp/canonical-decision-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalDecision.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalFetch.v \
              > /tmp/canonical-fetch-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-fetch-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical fetch::$line"
            done < <(tail -n 100 /tmp/canonical-fetch-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalFetch.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalInstruction.v \
              > /tmp/canonical-instruction-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-instruction-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical instruction::$line"
            done < <(tail -n 100 /tmp/canonical-instruction-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalInstruction.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyReturnWitness.v \
              > /tmp/canonical-return-witness-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-return-witness-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical return witness::$line"
            done < <(tail -n 100 /tmp/canonical-return-witness-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyReturnWitness.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyCanonicalLeftStep.v \
              > /tmp/canonical-left-step-coq.log 2>&1; then
            tail -n 100 /tmp/canonical-left-step-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq canonical left step::$line"
            done < <(tail -n 100 /tmp/canonical-left-step-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalLeftStep.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyRowStepGeneric.v \
              > /tmp/minsky-row-step-coq.log 2>&1; then
            tail -n 100 /tmp/minsky-row-step-coq.log
            while IFS= read -r line; do
