            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyRowStepWideLeft.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyRowStepWideLeft.vo
          echo 'NANLM MINSKY Q15-Q22 DIRECTION RELOCATION CYCLE PASS'

      - name: Upload independent Coq bridge certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minsky-coq-bridge-${{ github.run_id }}
          path: |
            formal/utm/MinskyTableData.v
            formal/utm/MinskyTableData.vo
            formal/utm/MinskyTable.v
            formal/utm/MinskyTable.vo
            formal/utm/MinskySourceEncoding.v
            formal/utm/MinskySourceEncoding.vo
