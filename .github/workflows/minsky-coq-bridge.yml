name: Fast Coq Minsky representation bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minsky-coq-bridge.yml'
      - 'formal/utm/**'
      - 'mth/tests/mth_minsky_compiler_general_test.nas'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bridge:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate pinned Coq 8.20 toolchain
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version

      - name: Check 184-row and native NaN16 transcriptions
        run: |
          python3 formal/utm/check_minsky_table.py
          python3 formal/utm/check_minsky_nan16_words.py
          python3 formal/utm/check_minsky_dispatch.py

      - name: Require non-vacuous nine-bit instruction execution
        run: |
          python3 formal/utm/check_minsky_source_execution.py \
            --require-steps 3 --require-both-directions \
            --check-native-expected --audit-naive-gap-decoder
          python3 formal/utm/check_minsky_source_execution.py \
            --fixture mth/tests/mth_minsky_compiler_p16_test.nas \
            --require-steps 2 --check-native-expected

      - name: Kernel-check table, full-tape bisimulation and run counting
        run: |
          set -euo pipefail
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTableData.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskySourceEncoding.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyWideSource.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTable.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyConcreteEntry.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyConcreteProgramScan.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyConcreteDispatch.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyWideConcreteDispatch.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyMarkedProgram.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyMatchMacro.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalMatch.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyMismatchErasure.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyActionMacro.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalCopy.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalCopyGeneral.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalDirection.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyHeadMoveMacro.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalRestore.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyWritebackMacro.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyRelocationMacro.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyDirectionDecision.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalDecision.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalFetch.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalInstruction.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyHeadRepresentation.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyDirectionCycle.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyVariableBuffer.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyMacroSimulation.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyWideMacroSimulation.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyEncodedFixture.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyAddressRefinement.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyChartEncoding.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyChartScan.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNativeBounds.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNativePages.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNaN16Words.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTable.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskySourceEncoding.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyWideSource.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyConcreteEntry.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyConcreteProgramScan.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyConcreteDispatch.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyWideConcreteDispatch.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyMarkedProgram.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyMatchMacro.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalMatch.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalCopy.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalCopyGeneral.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalDirection.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalRestore.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyMismatchErasure.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyActionMacro.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyWritebackMacro.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyHeadMoveMacro.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyRelocationMacro.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyDirectionDecision.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalDecision.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalFetch.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalInstruction.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyReturnWitness.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyReturnWitness.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyCanonicalLeftStep.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyCanonicalLeftStep.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyRowStepGeneric.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyRowStepGeneric.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyRowStepGenericLeft.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyRowStepGenericLeft.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyReturnOrientation.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyReturnOrientation.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyHeadRepresentation.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyDirectionCycle.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyVariableBuffer.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyMacroSimulation.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyWideMacroSimulation.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyEncodedFixture.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyAddressRefinement.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyChartEncoding.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyChartScan.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNativeBounds.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNativePages.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNaN16Words.vo
          if ! coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              formal/utm/MinskyDirectionRelocationCycle.v \
              > /tmp/minsky-direction-coq.log 2>&1; then
            echo 'Exact q15-q22 Coq diagnostic follows:'
            head -n 35 /tmp/minsky-direction-coq.log
            while IFS= read -r line; do
              echo "::error title=Coq q15-q22::$line"
            done < <(head -n 35 /tmp/minsky-direction-coq.log)
            exit 1
          fi
          coqchk -Q formal/utm NaNLM formal/utm/MinskyDirectionRelocationCycle.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedHalt.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedHalt.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedWideDispatch.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedWideDispatch.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedRightWide.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedRightWide.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedContinuation.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedContinuation.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedReentry.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedReentry.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedPrefetch.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedPrefetch.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTaggedImpossibility.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTaggedImpossibility.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyWidePass.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyWidePass.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLayout.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLayout.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLeft.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLeft.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookCycle.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookCycle.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLeftCycle.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLeftCycle.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLocate.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLocate.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLocateRows.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLocateRows.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLocateWide.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLocateWide.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLocateCycle.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLocateCycle.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookLocateLookup.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookLocateLookup.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfinite.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfinite.vo
          coqc -Q formal/utm NaNLM \
