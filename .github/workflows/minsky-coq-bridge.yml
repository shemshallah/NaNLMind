          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyBookRawBuffer.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyBookRawBuffer.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteWindow.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteWindow.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteLookup.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteLookup.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteLookupFull.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteLookupFull.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteSentinel.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteSentinel.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteEncode.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteEncode.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteLeftCheck.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteLeftCheck.vo
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyLeftInfiniteHalt.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyLeftInfiniteHalt.vo
          coqc -Q formal/utm NaNLM \
