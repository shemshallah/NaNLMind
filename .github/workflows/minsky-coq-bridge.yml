name: Fast Coq Minsky representation bridge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/minsky-coq-bridge.yml'
      - 'formal/utm/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bridge:
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Locate pinned Coq 8.20 toolchain
        run: |
          set -euo pipefail
          COQBIN=$(dirname "$(find /home/coq/.opam -name coqc -type f | head -1)")
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version

      - name: Check 184-row and native NaN16 transcriptions
        run: |
          python3 formal/utm/check_minsky_table.py
          python3 formal/utm/check_minsky_nan16_words.py

      - name: Kernel-check table, full-tape bisimulation and run counting
        run: |
          set -euo pipefail
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTableData.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskySourceEncoding.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyTable.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyConcreteEntry.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyConcreteProgramScan.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyEncodedFixture.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyAddressRefinement.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyChartEncoding.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyChartScan.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNativeBounds.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNativePages.v
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNaN16Words.v
          coqchk -Q formal/utm NaNLM formal/utm/MinskyTable.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskySourceEncoding.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyConcreteEntry.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyConcreteProgramScan.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyEncodedFixture.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyAddressRefinement.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyChartEncoding.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyChartScan.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNativeBounds.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNativePages.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNaN16Words.vo
          echo 'NANLM MINSKY SIX-BYTE LINEAR SCAN REFINEMENT PASS'

      - name: Upload independent Coq bridge certificate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minsky-coq-bridge-${{ github.run_id }}
          path: |
            formal/utm/MinskyTableData.v
            formal/utm/MinskyTableData.vo
            formal/utm/MinskyTable.v
            formal/utm/MinskyTable.vo
            formal/utm/MinskySourceEncoding.v
            formal/utm/MinskySourceEncoding.vo
            formal/utm/MinskyConcreteEntry.v
            formal/utm/MinskyConcreteEntry.vo
            formal/utm/MinskyConcreteProgramScan.v
            formal/utm/MinskyConcreteProgramScan.vo
            formal/utm/MinskyEncodedFixture.v
            formal/utm/MinskyEncodedFixture.vo
            formal/utm/MinskyAddressRefinement.v
            formal/utm/MinskyAddressRefinement.vo
            formal/utm/MinskyChartEncoding.v
            formal/utm/MinskyChartEncoding.vo
            formal/utm/MinskyChartScan.v
            formal/utm/MinskyChartScan.vo
            formal/utm/MinskyNativeBounds.v
            formal/utm/MinskyNativeBounds.vo
            formal/utm/MinskyNativePages.v
            formal/utm/MinskyNativePages.vo
            formal/utm/MinskyNaN16Words.v
            formal/utm/MinskyNaN16Words.vo
            formal/utm/check_minsky_nan16_words.py
          if-no-files-found: warn
          retention-days: 90
