name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compiler
        run: c++ --version
      - name: Build
        run: make -j2
      - name: Hermes native 256-head train and resume smoke
        run: |
          mkdir -p state
          ./build/nanlm-universal math-train data/alice_full.txt 2 128 state/hermes-universe.nmg state/hermes-discoveries-1.jsonl | tee state/hermes-first.log
          test -s state/hermes-universe.nmg
          python3 - <<'PY'
          import json
          from pathlib import Path
          events = [json.loads(line) for line in Path("state/hermes-discoveries-1.jsonl").read_text().splitlines()]
          assert len(events) == 256, len(events)
          assert {event["head"] for event in events} == set(range(256))
          assert len({event["source_digest"] for event in events}) == 1
          assert all(isinstance(event.get("hyperedge_id"), int) and event["hyperedge_id"] > 0 for event in events)
          assert len({event["hyperedge_id"] for event in events}) == 256
          print("validated 256 unique head discoveries and native hyperedges")
          PY
          ./build/nanlm-universal math-train data/alice_full.txt 1 64 state/hermes-universe.nmg state/hermes-discoveries-2.jsonl | tee state/hermes-resume.log
          grep -q resumed_state_bytes state/hermes-resume.log
          grep -q native_hyperedges_added=256 state/hermes-first.log
          grep -q native_hyperedges_added=256 state/hermes-resume.log
          test -s state/hermes-universe.nmg
          python3 - <<'PY'
          import json, pathlib, re
          events = [json.loads(x) for x in pathlib.Path("state/hermes-discoveries-2.jsonl").read_text().splitlines()]
          assert len(events) == 256 and {x["head"] for x in events} == set(range(256))
          def digest(path):
              match = re.search(r"state_digest=([0-9a-f]+)", pathlib.Path(path).read_text())
              assert match, path
              return match.group(1)
          first, second = digest("state/hermes-first.log"), digest("state/hermes-resume.log")
          assert first != second, (first, second)
          print("resume changed the restored global topology digest:", first, "->", second)
          PY
      - name: Resolution-aware relation train and replay smoke
        run: |
          mkdir -p state
          printf '%b\n' \
            'N16REL/1' \
            'train\t5\t+\t60000\t70656e6775696e\t69735f61\t62697264\t1111111111111111111111111111111111111111111111111111111111111111' \
            'train\t5\t-\t60000\t70656e6775696e\t63616e\t666c79\t2222222222222222222222222222222222222222222222222222222222222222' \
            'test\t5\t+\t60000\t6f737472696368\t69735f61\t62697264\t3333333333333333333333333333333333333333333333333333333333333333' \
            'test\t5\t-\t60000\t6f737472696368\t63616e\t666c79\t4444444444444444444444444444444444444444444444444444444444444444' \
            'train\t7\t+\t50000\t7269766572\t636f6e7461696e73\t7761746572\t5555555555555555555555555555555555555555555555555555555555555555' \
            'test\t7\t+\t50000\t73747265616d\t636f6e7461696e73\t7761746572\t6666666666666666666666666666666666666666666666666666666666666666' \
            > state/relations.n16rel
          ./build/nanlm-universal relation-train state/relations.n16rel state/relation-universe.nmg 2 | tee state/relation-first.log
          grep -q 'status=updated' state/relation-first.log
          grep -q 'mirror_pair_updates=9' state/relation-first.log
          grep -q 'hyperedges_added=3' state/relation-first.log
          grep -q 'resolution_L5' state/relation-first.log
          grep -q 'resolution_L7' state/relation-first.log
          ./build/nanlm-universal relation-train state/relations.n16rel state/relation-universe.nmg 2 | tee state/relation-replay.log
          grep -q 'status=no_op' state/relation-replay.log
          grep -q 'resolution_L5' state/relation-replay.log
          test -s state/relation-universe.nmg
      - name: Test suite
        run: make test
      - name: Install NANNET authority dependency
        run: python3 -m pip install cryptography
      - name: Unified NANNET and merge API tests
        run: make merge-test
      - name: Logic curriculum tests
        run: make logic-test
      - name: Training corpus and HERMES adapter tests
        run: make training-test
      - name: Conversational training loop tests
        run: make conversation-test
      - name: Universe training gate
        run: make universe-check
      - name: Legacy logic suite
        run: make legacy
      - name: Atomic clock self-test
        run: python3 runner/atomic_clock.py --self-test
      - name: Verify CLI
        run: ./build/nanlm-universal verify
      - name: Genesis
        run: ./build/nanlm-universal genesis
      - name: Global topology
        run: ./build/nanlm-universal global
      - name: Scale
        run: ./build/nanlm-universal scale
      - name: Phase
        run: ./build/nanlm-universal phase
      - name: Router
        run: ./build/nanlm-universal router
      - name: NTF
        run: ./build/nanlm-universal ntf
      - name: Kneser-Ney smoke
        run: ./build/nanlm-universal kn data/alice_full.txt 2
      - name: Snapshot/headshift smoke
        run: |
          mkdir -p state
          ./build/nanlm-universal snapshot --out state/chart.nmc
          ./build/nanlm-universal headshift --slot 1 --epoch 0 --runners 6             --snapshot state/chart.nmc --out state/chart.nmc --json state/packets.json
          test -s state/packets.json
      - name: Growth
        run: ./build/nanlm-universal growth
