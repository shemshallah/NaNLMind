name: nanlm atomic clock sync
# Anchor wall time from independent HTTPS sources, but only when the head ring
# is idle. The logical clock remains the state-ordering authority.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: nanlm-atomic

env:
  GH_TOKEN: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_PAT: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_RAM: ${{ vars.NANLM_RAM || format('{0}/nanlm-ram', github.repository_owner) }}
  DEEPREPO_VRAM: ${{ vars.NANLM_VRAM || format('{0}/nanlm-vram', github.repository_owner) }}
  DEEPREPO_RAM_BACKEND: github
  DEEPREPO_VRAM_BACKEND: github

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Skip if the head ring is active
        id: busy
        run: |
          n=$(gh run list -R "${{ github.repository }}" --workflow ring.yml \
              --status in_progress --limit 1 --json databaseId | python -c 'import json,sys; print(len(json.load(sys.stdin)))')
          echo "active=$n" >> "$GITHUB_OUTPUT"

      - name: Checkout deeprepo engine
        if: ${{ steps.busy.outputs.active == '0' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/deeprepo', github.repository_owner) }}
          token: ${{ secrets.DEEPREPO_PAT || github.token }}
          path: engine

      - uses: actions/setup-python@v5
        if: ${{ steps.busy.outputs.active == '0' }}
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-core.txt

      - name: Install engine deps
        if: ${{ steps.busy.outputs.active == '0' }}
        run: pip install -r engine/requirements-core.txt

      - name: Sync wall anchor
        if: ${{ steps.busy.outputs.active == '0' }}
        run: |
          PYTHONPATH=engine:. python runner/atomic_clock.py --sync | tee atomic.json

      - name: Summary
        run: |
          {
            echo "## atomic anchor"
            echo '```json'
            cat atomic.json 2>/dev/null || echo '(ring active; skipped)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
