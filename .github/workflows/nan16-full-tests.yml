name: NaN16 full tests

# Full, self-contained NaN16 verification on an Ubuntu GitHub runner.
#
# The local Termux environment crashes while kernel-reducing the literal
# run proofs, so this workflow is the authoritative check for the literal
# NaN16 cone.  It needs no external nan0s_work tree and no undecidability
# library: every module is compiled from formal/utm with Coq 8.20.
#
#   1. self-contained transcription / literal-image / certificate gates;
#   2. the complete transitive cone of
#      MinskyNaN16LiteralDecode, LiteralStep, LiteralImage, LiteralPuts,
#      RunConcrete, AddressStep and Universality (100 modules);
#   3. MinskyNaN16LiteralRun as a separate leaf: it now composes the
#      cached prefix/tail chunks instead of reducing the full run in one
#      vm_compute, so it is expected to compile; a failure is reported as
#      a warning by default (set require_literal_run=true to make it fatal);
#   3b. the cached prefix/tail split of the same 21,025-instruction run
#      (LiteralMachine + LiteralPrefix + LiteralTail01..11 + LiteralTail):
#      required, each 100-instruction chunk stays inside the runner's
#      memory;
#   4. coqchk on MinskyNaN16Universality.vo;
#   5. logs and key .vo/.glob artifacts for every run.
#
# The loader gate (check_nan16_loader.py) is intentionally NOT run: it
# requires an external NAN0S_WORK / nan0s_work checkout.

on:
  workflow_dispatch:
    inputs:
      require_literal_run:
        description: 'Fail if the monolithic MinskyNaN16LiteralRun proof OOMs (default: warn only)'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'formal/utm/**'
      - 'tools/**'
      - 'mth/tests/**'
      - '.github/workflows/nan16-full-tests.yml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: nan16-full-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  nan16-gates:
    name: Self-contained NaN16 gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check literal step / run100 transcription
        run: |
          set -euo pipefail
          mkdir -p logs
          python3 formal/utm/check_minsky_nan16_step.py 2>&1 \
            | tee logs/check_minsky_nan16_step.log
          echo "NAN16 STEP TRANSCRIPTION GATE PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Check literal image dumps and ISA-OBL-2 anchors
        run: |
          set -euo pipefail
          mkdir -p logs
          python3 formal/utm/check_nan16_literal_image.py 2>&1 \
            | tee logs/check_nan16_literal_image.log
          echo "NAN16 LITERAL IMAGE GATE PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify archived NaN16 certificate manifest and source anchors
        run: |
          set -euo pipefail
          mkdir -p logs
          # --allow-missing-vo: this job has no compiled .vo yet.  The full
          # .vo anchors are checked after the Coq cone job below.
          python3 tools/nan0s_compucert.py --allow-missing-vo -v 2>&1 \
            | tee logs/nan0s_compucert_manifest.log
          echo "NAN0S COMPUCERT MANIFEST PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nan16-full-gates-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30

  nan16-coq-cone:
    name: Coq 8.20 NaN16 full cone
    runs-on: ubuntu-latest
    container:
      image: coqorg/coq:8.20
      options: --user root --privileged
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Add swap headroom for the 21k-instruction kernel reduction
        run: |
          set -euo pipefail
          if ! command -v swapon >/dev/null 2>&1 || ! command -v mkswap >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq util-linux procps
          fi
          echo "memory.max: $(cat /sys/fs/cgroup/memory.max 2>/dev/null || echo n/a)"
          echo "memory.swap.max: $(cat /sys/fs/cgroup/memory.swap.max 2>/dev/null || echo n/a)"
          grep -E 'MemTotal|MemFree|SwapTotal|SwapFree' /proc/meminfo || true
          SWAPFILE=/__w/nan16-swapfile
          if ! swapon --show=NAME --noheadings 2>/dev/null | grep -qx "$SWAPFILE"; then
            fallocate -l 12G "$SWAPFILE" \
              || dd if=/dev/zero of="$SWAPFILE" bs=1M count=12288 status=none
            chmod 600 "$SWAPFILE"
            mkswap "$SWAPFILE"
            swapon "$SWAPFILE"
          fi
          grep -E 'MemTotal|MemFree|SwapTotal|SwapFree' /proc/meminfo
          swapon --show

      - name: Locate the pinned Coq 8.20 toolchain
        run: |
          set -euo pipefail
          # Coq's VM and conversion checker recurse on the native stack.
          # The default 8 MiB container stack is too small for the literal
          # NaN16 vm_compute proofs (Stack overflow at LiteralDecode.v:650).
          ulimit -s unlimited 2>/dev/null || ulimit -s 65536
          ulimit -s
          if command -v coqc >/dev/null 2>&1; then
            COQBIN=$(dirname "$(command -v coqc)")
          else
            COQC=$(find /home/coq/.opam -name coqc -type f | head -1)
            test -n "$COQC"
            COQBIN=$(dirname "$COQC")
          fi
          test -x "$COQBIN/coqc"
          echo "$COQBIN" >> "$GITHUB_PATH"
          "$COQBIN/coqc" --version | head -1
          "$COQBIN/coqchk" --version | head -1

      - name: Compile the full NaN16 cone
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || ulimit -s 65536
          echo "stack limit: $(ulimit -s)"
          mkdir -p logs
          # Transitive dependency cone of the seven headline modules, in
          # topological order.  Generated from the From NaNLM Require Import
          # graph.  MinskyNaN16LiteralRun is a leaf and is compiled by the
          # separate advisory step below.
          MODULES=(
            MinskyTableData
            MinskyTable
            MinskyAddressRefinement
            MinskyChartEncoding
            MinskyChartScan
            MinskyNaN16Words
            MinskyNaN16VM
            MinskyNaN16LiteralDecode
            LiteralImageData
            MinskyNaN16Action
            MinskyNaN16Prelude
            MinskyNaN16ActionMove
            MinskyNaN16ActionPrefix
            MinskyNaN16ActionSuffix
            MinskyNaN16ActionRefines
            MinskyNaN16Lookup
            MinskyNaN16ScanFrame
            MinskyNaN16ScanLoop
            MinskyNaN16ScanPhase
            MinskyNaN16StepHit
            MinskyNaN16StepNone
            MinskyNaN16Step
            MinskyNaN16PreludeReady
            MinskyNaN16ActionRun
            MinskyNaN16StepSpec
            MinskyNaN16StepEntrySpec
            MinskyNaN16Run
            MinskyNaN16StepOk
            MinskyNaN16RunClosed
            MinskyNaN16RunConcrete
            MinskyNaN16LiteralImage
            MinskyNaN16LiteralPuts
            MinskyNaN16LiteralOps
            MinskyNaN16LiteralExec
            MinskyNaN16LiteralShl
            MinskyNaN16LiteralShr
            MinskyNaN16LiteralCall
            MinskyNaN16LiteralRet
            MinskyNaN16LiteralBool
            MinskyNaN16LiteralStep
            MinskyNaN16LiteralPutc
            MinskyNaN16LiteralHalt
            MinskyNaN16PreserveHead
            MinskyNaN16PreserveTable
            MinskyNaN16SourceArith
            MinskyNaN16Window
            MinskyNaN16AddressStep
            MinskySourceEncoding
            MinskyConcreteEntry
            MinskyConcreteDispatch
            MinskyMatchMacro
            MinskyActionMacro
            MinskyCanonicalMatch
            MinskyCanonicalCopy
            MinskyCanonicalCopyGeneral
            MinskyCanonicalDirection
            MinskyHeadMoveMacro
            MinskyCanonicalRestore
            MinskyDirectionDecision
            MinskyWritebackMacro
            MinskyRelocationMacro
            MinskyCanonicalDecision
            MinskyCanonicalFetch
            MinskyCanonicalInstruction
            MinskyDirectionCycle
            MinskyConcreteProgramScan
            MinskyWideSource
            MinskyWideConcreteDispatch
            MinskyDirectionRelocationCycle
            MinskyTaggedHalt
            MinskyBookLayout
            MinskyBookCycle
            MinskyBookLocate
            MinskyBookLocateRows
            MinskyBookEncode
            MinskyBookLeft
            MinskyBookLeftCycle
            MinskyBookLocateWide
            MinskyBookLocateCycle
            MinskyBookLocateLookup
            MinskyLeftInfinite
            MinskyBookRawBuffer
            MinskyLeftInfiniteEncode
            MinskyLeftInfiniteFirstMatchApp
            MinskyLeftInfiniteLookup
            MinskyLeftInfiniteSentinel
            MinskyLeftInfiniteWindow
            MinskyLeftInfiniteHalt
            MinskyLeftInfiniteHaltBook
            MinskyLeftInfiniteLookupFull
            MinskyLeftInfiniteStepLeft
            MinskyLeftInfiniteStepRight
            MinskyLeftInfiniteEncoding
            MinskyLeftInfiniteBoundary
            MinskyLeftInfiniteBoundaryLocate
            MinskyLeftInfiniteBounded
            MinskyLeftInfiniteLeftDepth
            MinskyLeftInfiniteLift
            MinskyLeftInfiniteBoundaryBook
            MinskyLeftInfiniteBoundaryPremises
            MinskyLeftInfiniteBoundaryFinal
            MinskyLeftInfiniteBoundaryLookup
            MinskyLeftInfiniteBoundaryLifted
            MinskyLeftInfiniteClockInd
            MinskyLeftInfiniteLiftForward
            MinskyLeftInfiniteLiftBackward
            MinskyLeftInfiniteUniversality
            MinskyLeftInfiniteClockRun
            MinskyNaN16Universality
          )
          echo "Compiling ${#MODULES[@]} modules with $(coqc --version | head -1)"
          for f in "${MODULES[@]}"; do
            echo "=== coqc $f"
            coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              "formal/utm/$f.v" 2>&1 | tee "logs/coqc-$f.log"
          done
          echo "NAN16 FULL CONE COMPILED" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Compile the literal prefix/tail split (ISA-OBL-3d)
        timeout-minutes: 120
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || ulimit -s 65536
          mkdir -p logs
          # The 21,025-instruction full-fixture run is proven in two
          # cached halves so no single vm_compute reduction exceeds the
          # hosted runner's memory:
          #   MinskyNaN16LiteralMachine: literal NaN16 state machine,
          #     definitions only, no concrete reduction;
          #   MinskyNaN16LiteralPrefix: caches the certified 20,247-step
          #     prefix (same reduction as LiteralRun's first proof);
          #   MinskyNaN16LiteralTail01 .. Tail11: the remaining 778
          #     instructions on the cached prefix state, in eleven
          #     checked chunks of at most 100 instructions each (100
          #     steps for Tail01..05, 50 steps for Tail06..10, 28 for
          #     Tail11).  The per-chunk reducers keep each VM working
          #     set bounded, independent of the size of the cached
          #     prefix state;
          #   MinskyNaN16LiteralTail: composes the chunk equalities and
          #     proves the published PASS postconditions (halt, pc 28,
          #     payload 2/166/0, "MTH MINSKY NATIVE PASS", reg1 4357,
          #     code preserved).
          # This step is required: a failure here means the split proof
          # itself is wrong, not that resources ran out.
          for f in MinskyNaN16LiteralMachine \
                   MinskyNaN16LiteralPrefix \
                   MinskyNaN16LiteralTail01 \
                   MinskyNaN16LiteralTail02 \
                   MinskyNaN16LiteralTail03 \
                   MinskyNaN16LiteralTail04 \
                   MinskyNaN16LiteralTail05 \
                   MinskyNaN16LiteralTail06 \
                   MinskyNaN16LiteralTail07 \
                   MinskyNaN16LiteralTail08 \
                   MinskyNaN16LiteralTail09 \
                   MinskyNaN16LiteralTail10 \
                   MinskyNaN16LiteralTail11 \
                   MinskyNaN16LiteralTail \
                   MinskyNaN16LiteralBridge; do
            echo "=== coqc $f"
            coqc -Q formal/utm NaNLM \
              -w -notation-overridden,-stdlib-vector \
              "formal/utm/$f.v" 2>&1 | tee "logs/coqc-$f.log"
          done
          echo "NAN16 LITERAL PREFIX/TAIL SPLIT PROOF PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kernel-check the NaN16 universality theorem
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || ulimit -s 65536
          test -f formal/utm/MinskyNaN16Universality.vo
          coqchk -Q formal/utm NaNLM formal/utm/MinskyNaN16Universality.vo \
            2>&1 | tee logs/coqchk-MinskyNaN16Universality.log
          echo "NAN16 UNIVERSALITY KERNEL-CHECKED" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Advisory full certificate check including compiled .vo anchors
        id: compucert_full
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 tools/nan0s_compucert.py -v 2>&1 \
            | tee logs/nan0s_compucert_full.log

      - name: Note any advisory certificate mismatch
        if: steps.compucert_full.outcome == 'failure'
        run: |
          echo "::warning::Full nan0s_compucert .vo hash check did not pass; see logs/nan0s_compucert_full.log. Compilation, coqchk and the manifest/source-anchor gates are unaffected."

      - name: Compile MinskyNaN16LiteralRun (monolithic full-run leaf)
        id: literal_run
        continue-on-error: true
        timeout-minutes: 45
        run: |
          set -euo pipefail
          ulimit -s unlimited 2>/dev/null || ulimit -s 65536
          mkdir -p logs
          # This leaf contains 20,247- and 21,025-instruction vm_compute
          # proofs.  The 16 GiB runner plus 12 GiB swap clears the first
          # but not the second; the step is advisory so the rest of the
          # cone and coqchk are still verified.
          coqc -Q formal/utm NaNLM \
            -w -notation-overridden,-stdlib-vector \
            formal/utm/MinskyNaN16LiteralRun.v \
            2>&1 | tee logs/coqc-MinskyNaN16LiteralRun.log
          echo "NAN16 LITERAL RUN PROOF PASS" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Classify the monolithic LiteralRun outcome
        if: always()
        env:
          LITERAL_RUN_OUTCOME: ${{ steps.literal_run.outcome }}
          REQUIRE_LITERAL_RUN: ${{ github.event.inputs.require_literal_run || 'false' }}
        run: |
          set -euo pipefail
          echo "MinskyNaN16LiteralRun: ${LITERAL_RUN_OUTCOME}" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$LITERAL_RUN_OUTCOME" = "success" ]; then
            echo "NAN16 LITERAL RUN PROOF PASS" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          LOG=logs/coqc-MinskyNaN16LiteralRun.log
          if [ -f "$LOG" ] \
             && grep -qE '^Error:|^Anomaly|Uncaught exception' "$LOG" \
             && ! grep -q 'Error: Out of memory' "$LOG"; then
            echo "::error::MinskyNaN16LiteralRun failed for a non-resource reason; see $LOG"
            exit 1
          fi
          echo "::warning::MinskyNaN16LiteralRun was not kernel-checked: its monolithic 21,025-instruction vm_compute proof exceeded the hosted runner's memory (or timed out). The other 100 cone modules, coqchk Universality and all gates are unaffected. See $LOG."
          echo "MinskyNaN16LiteralRun: NOT CHECKED (resource limit), rest of cone unaffected" >> "$GITHUB_STEP_SUMMARY"
          if [ "$REQUIRE_LITERAL_RUN" = "true" ]; then
            echo "::error::require_literal_run=true, so the LiteralRun resource failure is fatal."
            exit 1
          fi

      - name: Upload Coq logs and key NaN16 artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nan16-full-coq-${{ github.run_id }}
          path: |
            logs/
            formal/utm/certificates/nan16-vm/
            formal/utm/MinskyNaN16LiteralDecode.vo
            formal/utm/MinskyNaN16LiteralDecode.glob
            formal/utm/MinskyNaN16LiteralImage.vo
            formal/utm/MinskyNaN16LiteralImage.glob
            formal/utm/MinskyNaN16LiteralPuts.vo
            formal/utm/MinskyNaN16LiteralPuts.glob
            formal/utm/MinskyNaN16LiteralStep.vo
            formal/utm/MinskyNaN16LiteralStep.glob
            formal/utm/MinskyNaN16LiteralOps.vo
            formal/utm/MinskyNaN16LiteralOps.glob
            formal/utm/MinskyNaN16LiteralExec.vo
            formal/utm/MinskyNaN16LiteralExec.glob
            formal/utm/MinskyNaN16LiteralShl.vo
            formal/utm/MinskyNaN16LiteralShl.glob
            formal/utm/MinskyNaN16LiteralShr.vo
            formal/utm/MinskyNaN16LiteralShr.glob
            formal/utm/MinskyNaN16LiteralCall.vo
            formal/utm/MinskyNaN16LiteralCall.glob
            formal/utm/MinskyNaN16LiteralRet.vo
            formal/utm/MinskyNaN16LiteralRet.glob
            formal/utm/MinskyNaN16LiteralBool.vo
            formal/utm/MinskyNaN16LiteralBool.glob
            formal/utm/MinskyNaN16LiteralPutc.vo
            formal/utm/MinskyNaN16LiteralPutc.glob
            formal/utm/MinskyNaN16LiteralHalt.vo
            formal/utm/MinskyNaN16LiteralHalt.glob
            formal/utm/MinskyNaN16LiteralRun.vo
            formal/utm/MinskyNaN16LiteralRun.glob
            formal/utm/MinskyNaN16LiteralMachine.vo
            formal/utm/MinskyNaN16LiteralMachine.glob
            formal/utm/MinskyNaN16LiteralPrefix.vo
            formal/utm/MinskyNaN16LiteralPrefix.glob
            formal/utm/MinskyNaN16LiteralTail01.vo
            formal/utm/MinskyNaN16LiteralTail01.glob
            formal/utm/MinskyNaN16LiteralTail02.vo
            formal/utm/MinskyNaN16LiteralTail02.glob
            formal/utm/MinskyNaN16LiteralTail03.vo
            formal/utm/MinskyNaN16LiteralTail03.glob
            formal/utm/MinskyNaN16LiteralTail04.vo
            formal/utm/MinskyNaN16LiteralTail04.glob
            formal/utm/MinskyNaN16LiteralTail05.vo
            formal/utm/MinskyNaN16LiteralTail05.glob
            formal/utm/MinskyNaN16LiteralTail06.vo
            formal/utm/MinskyNaN16LiteralTail06.glob
            formal/utm/MinskyNaN16LiteralTail07.vo
            formal/utm/MinskyNaN16LiteralTail07.glob
            formal/utm/MinskyNaN16LiteralTail08.vo
            formal/utm/MinskyNaN16LiteralTail08.glob
            formal/utm/MinskyNaN16LiteralTail09.vo
            formal/utm/MinskyNaN16LiteralTail09.glob
            formal/utm/MinskyNaN16LiteralTail10.vo
            formal/utm/MinskyNaN16LiteralTail10.glob
            formal/utm/MinskyNaN16LiteralTail11.vo
            formal/utm/MinskyNaN16LiteralTail11.glob
            formal/utm/MinskyNaN16LiteralTail.vo
            formal/utm/MinskyNaN16LiteralTail.glob
            formal/utm/MinskyNaN16LiteralBridge.vo
            formal/utm/MinskyNaN16LiteralBridge.glob
            formal/utm/MinskyNaN16RunConcrete.vo
            formal/utm/MinskyNaN16RunConcrete.glob
            formal/utm/MinskyNaN16AddressStep.vo
            formal/utm/MinskyNaN16AddressStep.glob
            formal/utm/MinskyNaN16Universality.vo
            formal/utm/MinskyNaN16Universality.glob
          if-no-files-found: warn
          retention-days: 30

      - name: Upload complete Coq object graph for fast bridge debug
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nan16-full-allvo-${{ github.run_id }}
          path: formal/utm/*.vo
          if-no-files-found: warn
          retention-days: 7
