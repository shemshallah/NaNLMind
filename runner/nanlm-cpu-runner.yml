name: NaNLMind head runner
# Dispatched by NaNLMind/ring.yml. One bounded head shift per run.
on:
  workflow_dispatch:
    inputs:
      op:
        description: selftest | prewarm | headshift | handoff | logic | logic-core | training | status | rss-status | math-preflight
        type: choice
        options: [selftest, prewarm, headshift, handoff, logic, logic-core, training, loop, finalize, unlock, status, rss-status, math-preflight]
        default: selftest
      slot:
        description: runner slot 1..6
        type: string
        default: "1"
      epoch:
        description: logical epoch
        type: string
        default: "0"
      minutes:
        description: shift wall-clock budget (max 300)
        type: string
        default: "300"
      epochs:
        description: epochs for op=loop
        type: string
        default: "200"
      rounds:
        description: repetitions per logic level
        type: string
        default: "4"
      start_level:
        description: first logic level 0..4
        type: string
        default: "0"
      session_rounds:
        description: cumulative logic rounds; 0 uses per-level rounds
        type: string
        default: "5"
      boolean_reps:
        description: Boolean foundation repetitions per head
        type: string
        default: "32"
      circuit_reps:
        description: deep logic circuit repetitions
        type: string
        default: "64"
      stage_seconds:
        description: per-stage wall budget for training
        type: string
        default: "1.0"
      single:
        description: optional single stage for op=training
        type: string
        default: ""
      max_samples:
        description: optional cap for op=training
        type: string
        default: "0"

permissions:
  contents: read

concurrency:
  group: nanlm-head-${{ inputs.slot }}
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_PAT: ${{ secrets.DEEPREPO_PAT }}
  DEEPREPO_MAIN: ${{ vars.NANLM_MAIN || format('{0}/NaNLMind', github.repository_owner) }}
  DEEPREPO_RAM: ${{ vars.NANLM_RAM || format('{0}/nanlm-ram', github.repository_owner) }}
  DEEPREPO_VRAM: ${{ vars.NANLM_VRAM || format('{0}/nanlm-vram', github.repository_owner) }}
  DEEPREPO_RAM_BACKEND: github
  DEEPREPO_VRAM_BACKEND: github
  NANLM_CORE: core
  NANLM_USE_CORE: "1"
  NANLM_LOCAL_STATE: ${{ github.workspace }}/state
  NANLM_MERGE_URL: ${{ vars.NANLM_MERGE_URL }}
  NANLM_MERGE_TOKEN: ${{ secrets.NANLM_MERGE_TOKEN }}

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout NaNLMind core
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.NANLM_MAIN || format('{0}/NaNLMind', github.repository_owner) }}
          token: ${{ secrets.DEEPREPO_PAT || github.token }}
          path: core

      - name: Checkout deeprepo engine (tiers, meters, gates)
        uses: actions/checkout@v4
        with:
          repository: ${{ format('{0}/deeprepo', github.repository_owner) }}
          token: ${{ secrets.DEEPREPO_PAT || github.token }}
          path: engine

      - name: Checkout NaNROUTER native mathematical runtime
        if: ${{ inputs.op == 'math-preflight' }}
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaNROUTER
          ref: math-linker-preflight
          path: nanrouter

      - name: Checkout canonical NaN0S registry and guest runtime
        if: ${{ inputs.op == 'math-preflight' }}
        uses: actions/checkout@v4
        with:
          repository: shemshallah/NaN0S
          ref: main
          path: nanrouter/nan0s

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements-core.txt

      - name: Install engine Python deps
        run: pip install -r engine/requirements-core.txt

      - name: Build NaNLMind core
        if: ${{ inputs.op == 'selftest' || inputs.op == 'prewarm' || inputs.op == 'headshift' || inputs.op == 'loop' || inputs.op == 'logic' || inputs.op == 'logic-core' || inputs.op == 'training' }}
        run: make -C core -j2

      - name: Execute head shift
        env:
          NANROUTER_ROOT: ${{ github.workspace }}/nanrouter
          NAN0S_ROOT: ${{ github.workspace }}/nanrouter/nan0s
        run: |
          set -euo pipefail
          PYTHONPATH=engine:core python3 core/runner/nanlm_worker.py \
            --op "${{ inputs.op }}" \
            --slot "${{ inputs.slot }}" \
            --epoch "${{ inputs.epoch }}" \
            --minutes "${{ inputs.minutes }}" \
            --epochs "${{ inputs.epochs }}" \
            --rounds "${{ inputs.rounds }}" \
            --session-rounds "${{ inputs.session_rounds }}" \
            --start-level "${{ inputs.start_level }}" \
            --boolean-reps "${{ inputs.boolean_reps }}" \
            --circuit-reps "${{ inputs.circuit_reps }}" \
            --stage-seconds "${{ inputs.stage_seconds }}" \
            --single "${{ inputs.single }}" \
            --max-samples "${{ inputs.max_samples }}"

      - name: Summary
        run: |
          {
            echo "## NaNLMind slot ${{ inputs.slot }}"
            echo "op=${{ inputs.op }} epoch=${{ inputs.epoch }}"
            echo '```json'
            cat state/*.json 2>/dev/null | tail -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
