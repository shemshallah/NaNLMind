# Illustrative Koyeb service definition. Use a persistent volume for /data.
name: nannet-portal
type: web
ports:
  - port: 8080
    protocol: http
build:
  docker:
    dockerfile: deploy/training_merge/Dockerfile
env:
  - key: NANLM_MERGE_ROOT
    value: /data
  - key: NANLM_MERGE_TOKEN
    secret: true
  - key: NANNET_AUTHORITY_MASTER_KEY
    secret: true
  - key: NANNET_AUTHORITY_DB
    value: /data/nannet-authority.sqlite
volumes:
  - mount_path: /data
    size_gb: 2
